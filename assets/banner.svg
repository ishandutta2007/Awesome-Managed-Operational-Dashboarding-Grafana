<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #FFFFFF; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94A3B8; }
    .badge-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #F8FAFC; }
    
    /* Animations */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .pulse-bg { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .animated-line { stroke-dasharray: 10, 10; animation: dash 5s linear infinite; }
    .floating-card { animation: float 4s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Animated Graph Background Elements (Positioned behind/around text) -->
  <g opacity="0.3" class="pulse-bg">
    <circle cx="1000" cy="80" r="140" fill="#6366F1" filter="url(#glow)" opacity="0.15" />
    <circle cx="150" cy="220" r="100" fill="#F97316" filter="url(#glow)" opacity="0.12" />
  </g>

  <!-- Decorative Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="700" y1="0" x2="700" y2="300" />
    <line x1="900" y1="0" x2="900" y2="300" />
    <line x1="1100" y1="0" x2="1100" y2="300" />
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
  </g>

  <!-- Dynamic Line Chart (Right Side Visual Graphic) -->
  <g transform="translate(750, 60)" class="floating-card">
    <!-- Card Backing -->
    <rect x="0" y="0" width="380" height="180" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
    
    <!-- Mini Metric Cards -->
    <rect x="20" y="20" width="100" height="45" rx="6" fill="#0F172A" opacity="0.8" />
    <text x="30" y="38" font-family="sans-serif" font-size="10" fill="#94A3B8">UPTIME</text>
    <text x="30" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4ADE80">99.99%</text>

    <rect x="135" y="20" width="100" height="45" rx="6" fill="#0F172A" opacity="0.8" />
    <text x="145" y="38" font-family="sans-serif" font-size="10" fill="#94A3B8">LATENCY</text>
    <text x="145" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">14ms</text>

    <rect x="250" y="20" width="110" height="45" rx="6" fill="#0F172A" opacity="0.8" />
    <text x="260" y="38" font-family="sans-serif" font-size="10" fill="#94A3B8">ACTIVE METRICS</text>
    <text x="260" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F97316">2.4M/s</text>

    <!-- Sparkline / Dashboard Wave -->
    <path d="M 20 140 Q 70 80, 120 120 T 220 90 T 320 130 L 360 110" fill="none" stroke="url(#lineGrad)" stroke-width="4" />
    <path d="M 20 140 Q 70 80, 120 120 T 220 90 T 320 130 L 360 110" fill="none" stroke="#38BDF8" stroke-width="2" class="animated-line" />
    
    <!-- Data Points -->
    <circle cx="120" cy="120" r="4" fill="#38BDF8" />
    <circle cx="220" cy="90" r="4" fill="#F97316" />
    <circle cx="360" cy="110" r="5" fill="#4ADE80" filter="url(#glow)" />
  </g>

  <!-- Left Accent Bar -->
  <rect x="65" y="70" width="6" height="160" rx="3" fill="url(#accentGrad)" />

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(90, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#F97316" opacity="0.2" />
      <rect x="0" y="0" width="220" height="26" rx="13" fill="none" stroke="#F97316" stroke-width="1" />
      <text x="15" y="17" class="badge-text" fill="#FB923C">⚡ OBSER VABILITY &amp; METRICS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title">Awesome Managed Grafana</text>
    <text x="0" y="172" class="title" fill="#38BDF8" font-size="34">&amp; Operational Dashboarding 📊</text>

    <!-- Subtitle -->
    <text x="0" y="212" class="subtitle">Curated SaaS Platforms, Grafana Ecosystem &amp; Open-Source Monitoring Stacks</text>
  </g>
</svg>
